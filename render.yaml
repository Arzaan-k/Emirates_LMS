# Render Blueprint for BWC LMS
# https://render.com/docs/application-specification

services:
  # Backend Web Service
  - type: web
    name: newlms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    region: singapore # Closer to India
    plan: free # Change to 'starter' for persistent uptime
    healthCheckPath: /health
    autoDeploy: true
    
    # Environment Variables
    # 'sync: false' means you must enter these values manually in the Render Dashboard
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: ENVIRONMENT
        value: production
      
      # Database (External Neon DB)
      - key: DATABASE_URL
        sync: false
      
      # Security
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # AI Services
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      
      # Voice Services
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "3AMU7jXQuQa3oRvRqUmb"
      
      # Cloudflare R2 (Video CDN)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "lms-videos"
      - key: R2_PUBLIC_URL
        value: "https://pub-eb982406c07d4331ae718930b1e64597.r2.dev"
