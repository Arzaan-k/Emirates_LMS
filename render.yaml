# Render Blueprint for BWC LMS
# https://render.com/docs/application-specification

services:
  # Backend Web Service
  - type: web
    name: newlms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_URL
        fromDatabase:
          name: newlms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DOMAIN
        value: main
      - key: ENVIRONMENT
        value: production
      # AI Keys (Must be added in Render Dashboard)
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "3AMU7jXQuQa3oRvRqUmb"
      - key: HUGGINGFACE_API_KEY
        sync: false

    # Service Settings
    plan: free # Change to 'starter' for persistent uptime
    region: singapore # Closer to India
    healthCheckPath: /health
    autoDeploy: true

# Managed PostgreSQL Database
databases:
  - name: newlms-db
    databaseName: newlms
    user: newlms_user
    plan: free # Ephemeral, upgrading to paid recommended for production data persistence
    region: singapore
